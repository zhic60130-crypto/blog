# Nginx 示例：托管 Astro 构建产物 dist/（含安全加固）
# 用法：把 site/dist 同步到 /var/www/moeyua-blog，include 本文件

# ---- HTTP：仅做 HTTPS 重定向（上线务必上 TLS，certbot 免费） ----
server {
    listen 80;
    server_name blog.your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name blog.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/blog.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/moeyua-blog;
    index index.html;

    # ---- 安全头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 静态站无内联脚本需求时可启用严格 CSP；本主题有内联 theme 脚本，故 script-src 含 'unsafe-inline'
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'" always;

    # 隐藏 Nginx 版本
    server_tokens off;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 长缓存：构建产物带哈希
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- 管理后台：默认仅允许你的 IP，改完再启用 ----
    location /admin/ {
        # allow 1.2.3.4;        # ← 你的常用出口 IP（手机热点另算）
        # deny all;
        # 不便固定 IP 时用 Basic Auth:
        # auth_basic "Admin";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }

    # ---- webhook 反代到 auto-deploy.mjs（仅 POST /hook） ----
    location = /hook {
        proxy_pass http://127.0.0.1:9876;
        proxy_method POST;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
}
