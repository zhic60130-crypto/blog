<svg xmlns="http://www.w3.org/2000/svg" viewBox="-320 -170 700 440" width="1400" height="880">
  <!-- 彩色版小家伙：与线稿同几何，保证"先勾线再上色"对齐 -->
  <g stroke="#4a3831" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- 纸飞机 -->
    <path d="M-270 95 L -243 13 L -203 60 L -224 100 Z" fill="#c9dcea"/>
    <path d="M-30 196 L 72 200 L 40 238 L -30 230 Z" fill="#c9dcea"/>
    <path d="M-270 95 C -100 122, 150 122, 330 152 L 60 202 L -60 196 Z" fill="#dbe9f2"/>
    <!-- 双马尾（无描边软毛） -->
    <g stroke="none" fill="#b78e79">
      <circle cx="-92" cy="-50" r="34"/>
      <circle cx="-112" cy="-8" r="32"/>
      <circle cx="-92" cy="32" r="30"/>
      <circle cx="-66" cy="60" r="24"/>
      <circle cx="-58" cy="94" r="32"/>
      <circle cx="-20" cy="114" r="28"/>
    </g>
    <!-- 身体 -->
    <ellipse cx="0" cy="28" rx="42" ry="32" fill="#5c4b42"/>
    <!-- 尾巴 -->
    <path d="M-42 66 q -62 8 -74 40 q 32 8 48 -8 q 22 10 38 0" fill="#dd8a63"/>
    <!-- 围巾 -->
    <ellipse cx="2" cy="62" rx="56" ry="24" fill="#dd8a63"/>
    <path d="M-30 58 q -8 14 0 26 M0 62 q -6 12 0 24 M30 58 q -8 14 0 26" fill="none" stroke="#f6efe6" stroke-width="6"/>
    <!-- 猫耳 -->
    <path d="M-46 -86 q -10 -42 12 -50 q 20 14 23 42 Z" fill="#b78e79"/>
    <path d="M46 -86 q 10 -42 -12 -50 q -20 14 -23 42 Z" fill="#b78e79"/>
    <path d="M-38 -92 q -2 -22 8 -28 q 10 8 12 24 Z" fill="#f6efe6" stroke="none"/>
    <path d="M38 -92 q 2 -22 -8 -28 q -10 8 -12 24 Z" fill="#f6efe6" stroke="none"/>
    <!-- 头 -->
    <circle cx="0" cy="-42" r="60" fill="#b78e79"/>
    <!-- 脸 -->
    <ellipse cx="0" cy="-30" rx="40" ry="32" fill="#f6efe6" stroke="none"/>
    <g stroke="none" fill="#b78e79">
      <circle cx="-26" cy="-56" r="18"/>
      <circle cx="0" cy="-60" r="18"/>
      <circle cx="26" cy="-56" r="18"/>
    </g>
    <ellipse cx="-22" cy="-34" rx="10" ry="14" fill="#3a2c26" stroke="none"/>
    <ellipse cx="22" cy="-34" rx="10" ry="14" fill="#3a2c26" stroke="none"/>
    <ellipse cx="2" cy="-12" rx="5" ry="4" fill="#d97d6d" stroke="none"/>
    <!-- 敬礼手 -->
    <circle cx="78" cy="-14" r="27" fill="#f6efe6"/>
    <path d="M60 -26 q 18 -6 34 2 M58 -8 q 20 -6 38 2" fill="none" stroke="#4a3831" stroke-width="5"/>
    <ellipse cx="60" cy="-58" rx="12" ry="9" fill="#f6efe6"/>
  </g>
</svg>
