# Decap CMS 配置 —— 字段与主题 content schema 一一对应
# 文档: https://decapcms.org/docs/

# 本地管理：在 site/ 目录跑 `npx decap-server` 后，
# 打开 /admin/ 即可免 OAuth 直接编辑本机文件（媒体上传到 public/images）
local_backend: true

backend:
  name: github
  # ⚠️ 替换成你自己的仓库（文章源码仓库，即包含 src/content 的这个工程）
  repo: your-name/your-blog-repo
  branch: main
  # 若不想走 Netlify 公共 OAuth 网关，可自建 OAuth provider 后填:
  # base_url: https://your-oauth-server.com

# 若用自建 GitLab，改成:
# backend:
#   name: gitlab
#   repo: your-group/your-blog-repo
#   base_url: https://gitlab.your-server.com

media_folder: public/images
public_folder: /images

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    slug: '{{slug}}'
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: pubDate, label: 发布日期, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - name: categories
        label: 分类
        widget: list
        field: { name: category, label: 分类, widget: string }
      - { name: description, label: 摘要, widget: text, required: false }
      - { name: draft, label: 草稿, widget: boolean, default: false, required: false }
      - { name: body, label: 正文, widget: markdown }

  - name: spec
    label: 单页
    label_singular: 页面
    files:
      - name: about
        label: 关于页
        file: src/content/spec/about.md
        fields:
          - { name: title, label: 标题, widget: string, required: false }
          - { name: pubDate, label: 发布日期, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
          - { name: body, label: 正文, widget: markdown }
      - name: profile
        label: 简介卡（头像/名字/简介）
        file: src/content/spec/profile.md
        fields:
          - { name: name, label: 名字, widget: string }
          - { name: avatar, label: 头像（可上传新图）, widget: image }
          - { name: desc, label: 一句话简介, widget: text }
          - { name: body, label: 简介列表/正文, widget: markdown }
